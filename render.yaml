services:
  - type: web
    name: nocteon-api
    runtime: java
    plan: free
    region: oregon
    rootDir: .
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/nocteon-api-*.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_HOST
        fromDatabase:
          name: nocteon-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: nocteon-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: nocteon-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: nocteon-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: nocteon-db
          property: password
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        sync: false
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: PAYMOB_API_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: PAYMOB_IFRAME_ID
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_TEMPLATE_ORDER_CONFIRMATION
        sync: false
      - key: BREVO_TEMPLATE_PAYMENT_SUCCESS
        sync: false
      - key: BREVO_TEMPLATE_ABANDONED_CART
        sync: false
      - key: BREVO_TEMPLATE_ADMIN_BROADCAST
        sync: false
      - key: BREVO_TEMPLATE_ORDER_SHIPPED
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://nocteon-coffee.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://nocteon-coffee.onrender.com
      - key: JAVA_OPTS
        value: -Xmx384m -Xms256m

databases:
  - name: nocteon-db
    databaseName: nocteon_db
    plan: free
    region: oregon