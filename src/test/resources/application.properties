# Test-only overrides. The Spring TestContext cache keeps one Hikari pool per distinct
# context configuration; this suite builds ~20 of them, so the default pool size (10)
# can demand 200 PostgreSQL connections and hit "FATAL: sorry, too many clients already".
# A small pool is plenty for these tests because only a few use concurrent requests.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
