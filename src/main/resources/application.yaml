server:
  # Render terminates TLS and forwards X-Forwarded-*. Use Tomcat's RemoteIpValve
  # (native) with its trusted internal-proxies list, not Spring's
  # ForwardedHeaderFilter (framework), which would trust such headers from any
  # direct client and defeat the rate-limit IP checks.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      protocol-header-https-value: https

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  config:
    import: optional:file:.env[.properties]
  application:
    name: nocteon-api
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    default-locale: en

  output:
    ansi:
      enabled: ALWAYS

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:nocteon_db}}
    username: ${DATABASE_USERNAME:${DATABASE_USER:postgres}}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    # Controllers must not rely on an EntityManager that stays open during rendering.
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true
    # Schema + operational reference data in db/migration; demo catalog/order/user
    # data in db/seed. Production overrides this with
    # SPRING_FLYWAY_LOCATIONS=classpath:db/migration so no demo data is loaded.
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
    # Schema lives below V100 and demo seeds at V100+, so a schema migration written
    # after a database was seeded is versioned "behind" it. Without this, validate
    # fails at startup on every developer/CI database (and on render, where the seed
    # range is absent but an older seeded database may exist) instead of applying the
    # additive change. Production's location is db/migration only and stays in order.
    out-of-order: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      # Startup PING / command timeout for the Bucket4j Lettuce client.
      timeout: ${REDIS_TIMEOUT:5s}
      ssl:
        enabled: ${REDIS_SSL:false}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:placeholder-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-google-client-secret}
            scope: email, profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:placeholder-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:placeholder-github-client-secret}
            scope: user:email, read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true

  ai:
    # ── provider selectors ────────────────────────────────────────────────
    # Spring AI 2.0.1 gates every provider's model autoconfiguration on one of
    # these properties, each with `matchIfMissing = true`. With more than one
    # starter on the classpath, an unset selector means two autoconfigurations
    # both try to define the same bean type.
    #
    # NONE of these are set here — not `chat`, and neither embedding selector.
    # They are derived from the environment:
    # ChatProviderEnvironmentPostProcessor from GROQ_API_KEY, and
    # EmbeddingProviderEnvironmentPostProcessor from, in this order:
    #   AI_EMBEDDING_PROVIDER (the switch, and the only route to Ollama)
    #   GEMINI_API_KEY        (preferred hosted provider)
    #   EMBEDDING_API_KEY     (generic OpenAI-compatible provider)
    #   nothing               (keyword-only: no EmbeddingModel, no vector index)
    # A YAML placeholder cannot be conditional, and an environment post-processor
    # runs before the context exists, which is the only point where the decision
    # can still be made.
    #
    # Set either directly to override that decision — `AI_CHAT_PROVIDER=ollama`,
    # `AI_EMBEDDING_PROVIDER=gemini`, or `spring.ai.model.embedding.text=google-genai` / `=none`.
    #
    # The embedding case needs BOTH selectors, and that is Spring AI's design
    # rather than ours: Ollama and OpenAI test `spring.ai.model.embedding`, while
    # the Gemini starter tests `spring.ai.model.embedding.text`. Verified against
    # the 2.0.1 jars. Only one EmbeddingModel may exist — PgVectorStore is
    # constructed with it, so an ambiguous one is a boot failure — so the
    # post-processor switches the rejected providers off rather than leaving their
    # selectors unset.
    #
    # Ollama is NOT the fallback. With no key at all the post-processor writes
    # `spring.ai.vectorstore.type=none` and the app runs keyword-only; a local
    # model server is a requirement nobody on a hosted deployment can satisfy, so
    # defaulting to it would be a silent dependency rather than a graceful one.
    model:
      # No image or moderation model is used anywhere in this project, and the
      # OpenAI and Google starters would otherwise auto-configure both against a
      # base URL and key that are only meant for embeddings.
      image: none
      moderation: none

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # `never` (the Spring AI 2.0.1 default) is deliberate: Spring AI must never
        # block or fail application startup on an external Ollama call — with any
        # other value the model beans are pre-instantiated during context refresh
        # and pull-model would burn the 5m timeout and abort boot when Ollama is
        # down. Models are provisioned by the `ollama-init` compose service on
        # `docker compose up` (or manually via `docker compose run --rm ollama-init`),
        # so with `never` Spring AI never pulls and never contacts Ollama at startup.
        pull-model-strategy: never
      chat:
        # The local chat fallback. Used whenever GROQ_API_KEY is unset, which is
        # the zero-configuration path for the assistant alone: no API key, no
        # account, no network. Chat may fall back to a local model because a chat
        # failure is visible to the one person who asked; the embedding model may
        # not, because a silent fallback there corrupts the index instead.
        options:
          model: ${AI_LOCAL_CHAT_MODEL:qwen2.5:3b-instruct}
          temperature: 0.7
      embedding:
        options:
          # Read only when AI_EMBEDDING_PROVIDER=ollama — an explicit opt-in, never a
          # default. `nomic-embed-text` emits 768 dimensions, matching `vector_store`.
          model: ${EMBEDDING_OLLAMA_MODEL:nomic-embed-text}

    # Gemini embeddings, through the AI Studio API (a plain `GEMINI_API_KEY`).
    # NOT the Vertex AI path, which authenticates with Google Cloud credentials
    # and needs a billing-enabled Cloud project; the starter for that is a
    # different artifact (`spring-ai-starter-model-vertex-ai-embedding`).
    #
    # This is the preferred hosted provider: a non-blank GEMINI_API_KEY selects it
    # unless AI_EMBEDDING_PROVIDER says otherwise. Groq has no embeddings endpoint,
    # so the chat key is never used here.
    google:
      genai:
        embedding:
          # Blank by default, never a committed value: an unset variable must
          # leave the project on keyword-only search rather than half-configured.
          api-key: ${GEMINI_API_KEY:}
          text:
            # `gemini-embedding-2` rather than `gemini-embedding-001`: it
            # auto-normalizes non-default output dimensions, so 768 comes back
            # unit-length and ready for the cosine distance below.
            model: gemini-embedding-2
            # Matryoshka (MRL) truncation. 768 is the vector column width of
            # `vector_store` and one of the three dimensions Google recommends,
            # so this is why the model swap needs no schema change and no table
            # rebuild. Verified live against the real API: 768 in, 768 out,
            # L2 norm 1.000000.
            dimensions: 768

    # Groq, over its OpenAI-compatible endpoint. Only read when
    # `spring.ai.model.chat` resolves to `openai`, i.e. when GROQ_API_KEY is set.
    #
    # The `/openai/v1` suffix is required and not obvious: Groq's OpenAI-compatible API lives
    # under `/openai/v1`, not `/openai`. Verified against the live endpoint — with
    # `https://api.groq.com/openai` the client gets
    #   404: Unknown request URL: POST /openai/chat/completions
    # and with the `/v1` form it gets 401 for a bad key, which is the correct answer.
    # Spring AI appends `/chat/completions` to this value, so it must be the API root.
    openai:
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${GROQ_API_KEY:}
      chat:
        options:
          # A NON-reasoning model is required, not a preference.
          #
          # openai/gpt-oss-20b is a reasoning model: it returns a `reasoning_content` field on
          # every assistant turn. Spring AI's tool-calling loop replays that assistant message
          # verbatim in the follow-up request, and Groq rejects it —
          #   400 'messages.2' : for 'role:assistant' the following must be satisfied
          #        [('messages.2' : property 'reasoning_content' is unsupported)]
          # — so any question that reaches a catalog tool answers with the failure apology
          # instead of a recommendation, while a question that happens not to call a tool works
          # fine. That asymmetry is what made it look intermittent rather than broken.
          #
          # This cannot be configured away in Spring AI 2.0.1: the request is built by the
          # openai-java client's ChatCompletionCreateParams, which has no reasoning field, and
          # nothing in spring-ai-openai-2.0.1 emits `reasoning_effort` (checked at the bytecode
          # level). OpenAiChatOptions.getReasoningEffort() exists and is readable but is never
          # written into the body, so `reasoning-effort: low` is silently dead config.
          #
          # The free tier offers exactly three chat models with access on this account
          # (llama-3.1-8b-instant and llama-3.3-70b-versatile are Enterprise-gated and return
          # "does not exist or you do not have access"), and both gpt-oss models are reasoning
          # models, so qwen/qwen3.8-27b is the only free-tier model whose tool loop completes.
          # Verified live: a full two-step tool round trip returns
          # "The **Brazil Mogiana** coffee costs **$240**." with no reasoning field on the wire.
          model: ${GROQ_CHAT_MODEL:qwen/qwen3.8-27b}
          temperature: 0.7

      # ── the generic OpenAI-compatible embedding provider ────────────────
      # Same starter, different credentials: Spring AI's OpenAI client is one
      # class of HTTP client, and every hosted vendor that speaks the
      # OpenAI-compatible embeddings API (OpenAI, Together, Fireworks, DeepInfra,
      # Voyage's compatible endpoint, a self-hosted vLLM, ...) is reachable from
      # it without a code change. Selected by `AI_EMBEDDING_PROVIDER=openai-compatible`
      # or, when the switch is unset, by a non-blank EMBEDDING_API_KEY.
      #
      # The embedding block overrides `base-url` and `api-key` per its own
      # sub-properties — verified in the 2.0.1 bytecode: OpenAiAutoConfigurationUtil
      # resolves the embedding-specific value first and falls back to the common
      # one. That is exactly what lets chat stay on Groq while embeddings go to a
      # different vendor.
      #
      # `dimensions` is sent as a request parameter. Vendors that do not accept it
      # must be given a model that natively emits 768 — the width is not optional,
      # because `vector_store` is `vector(768)`.
      embedding:
        base-url: ${EMBEDDING_BASE_URL:https://api.openai.com/v1}
        api-key: ${EMBEDDING_API_KEY:}
        model: ${EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${EMBEDDING_DIMENSIONS:768}

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: hnsw
        distance-type: cosine_distance
        # The column width every embedding provider has to produce. It is part of
        # the index fingerprint (EmbeddingModelFingerprint), so both this value and
        # the provider's requested width have to change together.
        #
        # `type` is not set here: the post-processor writes
        # `spring.ai.vectorstore.type=none` when no embedding provider is
        # configured, which is what turns "no key" into keyword-only search
        # instead of "PgVectorStore cannot be constructed".
        dimensions: 768
        max-document-batch-size: 100

nocteon:
  notifications:
    # Server-sent-event notification stream (FE-23).
    stream:
      # How long one connection may stay open before the client reconnects. The
      # client resets its backoff on a successful open, so this is a scheduled
      # reconnect, not an error path.
      timeout-ms: ${NOTIFICATIONS_STREAM_TIMEOUT_MS:1800000}
      # Keep-alive so a proxy does not cut an idle stream. Must stay well below
      # the usual 60s idle timeout. Tests set this to a few hundred ms.
      heartbeat-ms: ${NOTIFICATIONS_STREAM_HEARTBEAT_MS:25000}
      # How a notification batch reaches an emitter attached to another instance:
      #   redis → publish on pub/sub, every instance fans out to its own emitters.
      #           Required for two or more instances behind a load balancer.
      #   local → in-process only; correct for a single instance, and what a test or
      #           a broker-less environment uses.
      # Single-instance behaviour is identical either way; the property changes reach,
      # not payloads. The channel design is explained in DECISIONS.md.
      transport: ${NOTIFICATIONS_STREAM_TRANSPORT:redis}
  ai:
    enabled: ${AI_ENABLED:true}
    search-enabled: ${AI_SEARCH_ENABLED:true}
    chatbot-enabled: ${AI_CHATBOT_ENABLED:true}
  mail:
    from: ${MAIL_FROM:nocteoncoffee@gmail.com}
    from-name: Nocteon Coffee
    # Gates the two background mail jobs (AbandonedCartScheduler, EmailRetryScheduler).
    # Off by default: enabling it starts sending abandoned-cart reminders and retrying
    # Brevo sends, so it must be a deliberate per-environment decision.
    scheduling-enabled: ${MAIL_SCHEDULING_ENABLED:false}
    # Hours of inactivity before a cart is considered abandoned. Default 24h.
    # Used by both the dashboard status calculation and the abandoned-cart mail job.
    abandoned-cart-hours: ${ABANDONED_CART_HOURS:24}

application:
  paymob:
    api-key: ${PAYMOB_API_KEY:}
    integration-id: ${PAYMOB_INTEGRATION_ID:}
    iframe-id: ${PAYMOB_IFRAME_ID:}
    hmac-secret: ${PAYMOB_HMAC_SECRET:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  brevo:
    api-key: ${BREVO_API_KEY:}
    base-url: https://api.brevo.com/v3
    sender-name: Nocteon
    sender-email: ${BREVO_SENDER_EMAIL:nocteoncoffee@gmail.com}
    templates:
      order-confirmation: ${BREVO_TEMPLATE_ORDER_CONFIRMATION:}
      payment-success: ${BREVO_TEMPLATE_PAYMENT_SUCCESS:}
      abandoned-cart: ${BREVO_TEMPLATE_ABANDONED_CART:}
      admin-broadcast: ${BREVO_TEMPLATE_ADMIN_BROADCAST:}
      order-shipped: ${BREVO_TEMPLATE_ORDER_SHIPPED:}
      order-status-changed: ${BREVO_TEMPLATE_ORDER_STATUS_CHANGED:}
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  security:
    jwt:
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
    verification:
      token-expiry-hours: 24
    reset:
      token-expiry-hours: 1
    lockout:
      max-attempts: 5
      duration-minutes: 30
  # Rate limiting. trusted-proxies is empty by default (trust no proxy) so that
  # clients cannot spoof X-Real-IP to evade per-IP limits. Only set it to the
  # IPs/CIDRs of reverse proxies you control, e.g. 127.0.0.1,10.0.0.0/8.
  # rate-limit:
  #   trusted-proxies: ""
  # cloudinary:
  #   reconcile:
  #     enabled: false          # set true to run the orphan dry-run once at startup
  #     grace-period-hours: 24  # only report assets older than this
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    # SMTP credentials and reachability are an OPS alert, not a platform
    # health check: a bad mail password once turned /actuator/health into 503
    # while the app served every request. Readiness covers db + redis below;
    # mail failures are recorded in email_logs and surfaced by the retry job.
    mail:
      enabled: false
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        readiness:
          include: db,redis
      
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true


# ═══════════════════════════════════
#         AUDIT LOG RETENTION
# ═══════════════════════════════════
# Read by AuditRetentionProperties; the job itself is AuditLogRetentionScheduler.
# audit_logs grows with every login and every admin action, so without a sweep it
# becomes the largest object in the database. The sweep is opt-in on purpose:
# deleting audit history cannot be undone by re-enabling a flag, so it must be a
# deliberate per-environment decision rather than a side effect of a deploy.
app:
  audit:
    retention:
      # Gates AuditLogRetentionScheduler. Off by default: the job stays dormant
      # (it returns before running a single query) until this is set to true.
      enabled: ${AUDIT_RETENTION_ENABLED:false}
      # Rows whose created_at is older than this many days are deleted; rows
      # younger than the horizon are never touched. Keep it above the longest
      # period an investigation or support ticket can reasonably reach back.
      days: ${AUDIT_RETENTION_DAYS:180}
      # Rows per delete statement. Each batch is its own transaction, so the job
      # commits and frees its locks every batch-size rows instead of holding one
      # long transaction over the whole backlog. Lower it if writers on a large
      # table see lock waits; the pass just takes more statements.
      batch-size: ${AUDIT_RETENTION_BATCH_SIZE:5000}


# ═══════════════════════════════════
#              LOGGING
# ═══════════════════════════════════
logging:
  pattern:
    console: "%clr(%d{HH:mm:ss}){faint} %clr(%5p){highlight} %clr([%15.15t]){faint} %clr(%-30logger{0}){cyan} %clr(:){faint} %m%n"
  level:
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.orm.jdbc.bind]": TRACE
    "[com.nocteon.nocteon_api]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.flywaydb]": INFO
