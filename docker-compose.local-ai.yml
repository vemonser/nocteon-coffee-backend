# Local AI (embeddings) override.
#
# The `ollama` service is behind the `local-ai` profile and the app's
# OLLAMA_BASE_URL defaults to http://localhost:11434 — which, from inside the
# app container, is the app itself. This override points the app at the compose
# service and says which provider the embeddings use, so semantic search works
# without a hosted embedding key.
#
#   docker compose -f docker-compose.yml -f docker-compose.local-ai.yml \
#     --profile local-ai up -d ollama app
#
# Chat stays on Groq when GROQ_API_KEY is set; Ollama only serves embeddings.
services:
  app:
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      AI_EMBEDDING_PROVIDER: ollama

# NOTE (no NVIDIA GPU): the `ollama` service in docker-compose.yml reserves a GPU
# (`deploy.resources.reservations.devices: nvidia`), so on a CPU-only machine
# `--profile local-ai up -d ollama` fails with
#   could not select device driver "nvidia"
# Run the same image without that reservation instead, on the compose network:
#
#   docker run -d --name ollama --network <project>_default \
#     -v nocteon-ollama-data:/root/.ollama ollama/ollama:latest
#   docker exec ollama ollama pull nomic-embed-text
#   docker compose -f docker-compose.yml -f docker-compose.local-ai.yml up -d app
#
# Verified on this machine: the app reaches ollama:11434, the index reports
# stale=0 after a reindex, and GET /api/products?semantic=true answers.
