name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A push and its PR run duplicate the whole build. The PR run is the one that
# gates, so cancel the older push run rather than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nocteon_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nocteon_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # JDK 25 LTS, matching `java.version` in pom.xml. Lombok 1.18.46 supports
      # JDK 25; 1.18.48 has a known @Builder regression, so the version is pinned
      # deliberately rather than floating.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # PostgreSQL 16 with pgvector and Redis 7 are provided by the service
      # containers above, so the context-loading and integration tests (which
      # need a migrated schema) can run here instead of being excluded.
      - name: Verify
        run: ./mvnw -B verify