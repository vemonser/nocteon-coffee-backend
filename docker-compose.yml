services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nocteon-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period : 20s

  redis:
    image: redis:7-alpine
    container_name: nocteon-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Optional local-AI stack ─────────────────────────────────────────────
  # Behind the `local-ai` profile, so `docker compose up -d` neither starts
  # them nor pulls the image. `ollama/ollama:latest` is ~1 GB on its own and
  # ollama-init then downloads two more models into the volume (~2 GB), which
  # is the single largest thing anyone setting this project up downloads.
  #
  # Start them only when you actually need the zero-API-key fallback:
  #   docker compose --profile local-ai up -d
  #
  # You need this when GEMINI_API_KEY and GROQ_API_KEY are both blank. With
  # either key set, the application never contacts Ollama — it wires the
  # hosted provider instead and this profile buys nothing but disk and RAM.
  #
  # The `deploy` block requires the NVIDIA container toolkit.
  # Deleting it (the `deploy` block) falls back to CPU inference.
  ollama:
    image: ollama/ollama:latest
    container_name: nocteon-ollama
    restart: unless-stopped
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot model initializer: pre-pulls the embedding + chat models into the
  # ollama-data volume, then exits. Same `local-ai` profile as the model server
  # it waits for — starting one without the other cannot work, and compose
  # would refuse the `depends_on` anyway.
  #
  # Nothing depends on this container, so it never blocks or fails a normal
  # `docker compose up` — if a pull cannot complete (e.g. no network) it retries
  # for up to ~10 minutes (60 x 5s attempts PER MODEL, two models) and then
  # exits 1 on its own. Re-run manually with:
  #   docker compose --profile local-ai run --rm ollama-init
  # Caveats (this service only, cosmetic): `docker compose up --wait` and
  # `--exit-code-from` report it as failed because its terminal state is
  # "exited", not "running" — plain `up` / `up -d` are unaffected. On the first
  # run prefer `up -d`: the model downloads (~2 GB) otherwise stream into your
  # terminal alongside the other services.
  ollama-init:
    image: ollama/ollama:latest
    container_name: nocteon-ollama-init
    restart: "no"
    profiles: ["local-ai"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    # NOTE: shell variables are written as $$ — compose would otherwise
    # interpolate $model/$attempt/$pulled as (unset) compose variables.
    command:
      - |
        for model in nomic-embed-text qwen2.5:3b-instruct; do
          pulled=""
          for attempt in $$(seq 1 60); do
            if ollama pull "$$model"; then
              pulled=1
              break
            fi
            echo "ollama-init: pull of $$model failed (attempt $$attempt/60); retrying in 5s"
            sleep 5
          done
          if [ -z "$$pulled" ]; then
            echo "ollama-init: could not pull $$model" >&2
            exit 1
          fi
        done
        echo "ollama-init: all models are present"

volumes:
  postgres-data:
  redis-data:
  # Only mounted by the `local-ai` profile, so a default `docker compose up`
  # never creates it.
  ollama-data:
